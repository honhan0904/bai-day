  <style>
    :root{color-scheme:light;--ink:#26324a;--muted:#667085;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 8% 8%,#dff5ff 0,transparent 31%),radial-gradient(ellipse at 95% 5%,#ffe8c4 0,transparent 28%),linear-gradient(160deg,#fff9ec,#f1fbf2)}.page{width:min(900px,calc(100% - 36px));margin:auto;padding:48px 0 32px}header{text-align:center;margin:0 auto 34px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid #f0dfc2;border-radius:999px;background:#fffdf9d9;color:#77633e;font-size:.84rem;font-weight:800;letter-spacing:.04em}h1{margin:17px 0 10px;font-size:clamp(2.35rem,7vw,4.6rem);line-height:1.04;letter-spacing:-.055em;color:#25344f}.intro{margin:0 auto;max-width:540px;color:var(--muted);font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.65}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.lesson-card{--accent:#56b8a9;position:relative;display:flex;min-height:245px;flex-direction:column;align-items:flex-start;padding:25px;overflow:hidden;color:inherit;text-decoration:none;background:var(--paper);border:2px solid #fff;border-radius:26px;box-shadow:0 12px 30px #394a6810;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.lesson-card::after{content:"";position:absolute;right:-32px;top:-35px;width:125px;height:125px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,white)}.lesson-card:hover,.lesson-card:focus-visible{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 55%,white);box-shadow:0 18px 34px #394a681b;outline:none}.icon{position:relative;z-index:1;display:grid;width:76px;height:76px;place-items:center;margin-bottom:17px;border-radius:23px;background:color-mix(in srgb,var(--accent) 14%,white);font-size:2.7rem}.lesson-title{font-size:1.45rem;font-weight:900;letter-spacing:-.025em}.lesson-desc{margin-top:7px;color:var(--muted);font-size:.98rem;line-height:1.5}.open-link{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:17px;color:var(--accent);font-weight:900}footer{padding-top:27px;color:#788397;text-align:center;font-size:.9rem}@media(max-width:560px){.page{width:min(100% - 26px,420px);padding-top:34px}.lesson-grid{grid-template-columns:1fr;gap:13px}.lesson-card{min-height:0;display:grid;grid-template-columns:68px 1fr;column-gap:15px;align-items:center;padding:17px;border-radius:22px}.icon{grid-row:span 3;width:65px;height:65px;margin:0;font-size:2.3rem}.lesson-title{align-self:end}.lesson-desc{margin-top:2px}.open-link{padding-top:7px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
